<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Digger Prototype</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="topHud">
    <div id="staminaWrap">
      <div id="staminaBar"></div>
    </div>

    <div id="coins">🪙 0</div>
  </div>

  <div id="depth">0m</div>

  <button id="bagButton">
    🎒 <span id="bagAmount">0/10</span>
  </button>

  <button id="torchButton">
    🔥
    <span id="torchCount">5</span>
  </button>

  <div id="controls">
    <button class="move" id="up">▲</button>
    <button class="move" id="down">▼</button>
    <button class="move" id="left">◀</button>
    <button class="move" id="right">▶</button>
  </div>

  <div id="message"></div>

  <div id="surfacePanel">
    SURFACE<br>
    Ore sells automatically
  </div>

  <div id="bagPanel">

    <div id="bagHeader">
      <h2>🎒 Backpack</h2>

      <button id="closeBag">
        ×
      </button>
    </div>

    <div id="weightInfo"></div>

    <div id="bagContents"></div>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
